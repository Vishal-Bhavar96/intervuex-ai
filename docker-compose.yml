version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://intervuex_user:intervuex_pass@db:5432/intervuex_db
      - JWT_SECRET=intervuex-production-super-secret-key-2026
      - AI_PROVIDER=auto
      - AI_API_KEY=${AI_API_KEY}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: intervuex_user
      POSTGRES_PASSWORD: intervuex_pass
      POSTGRES_DB: intervuex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
